name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The prebuilt Node.js .so files come from a GitHub Release (free
      # bandwidth, unlike LFS). Cache keyed on the pinned checksum so the
      # ~33MB download only happens when the libs actually change.
      - uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: node-libs-${{ hashFiles('scripts/node-libs.sha256') }}
      - run: ./scripts/fetch-node-libs.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test, lint
        run: |
          set +e
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace 2>&1 | tee gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            grep -E "(^e: |FAILURE:|> Task .* FAILED|Exception|Error)" gradle.log | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$EXIT_CODE"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish debug APK to GitHub Releases (mvp-debug-latest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            if gh release view mvp-debug-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload mvp-debug-latest "$APK_PATH" --clobber -R "$GITHUB_REPOSITORY"
            else
              gh release create mvp-debug-latest "$APK_PATH" \
                --title "4AIs MVP Debug APK (Latest)" \
                --notes "Installable debug APK built from commit ${{ github.sha }}." \
                --prerelease \
                -R "$GITHUB_REPOSITORY"
            fi
          fi
      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
